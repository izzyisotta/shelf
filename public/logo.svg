<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <!-- Book leaning like / against the wordmark -->
  <g transform="translate(14, 2)">
    <g transform="rotate(15, 10, 28)">
      <!-- Book cover (front) -->
      <rect x="0" y="0" width="16" height="52" rx="2" fill="#D9A648"/>
      <!-- Page block (visible edge) -->
      <rect x="16" y="3" width="4" height="46" rx="1" fill="#EFEAE1"/>
      <!-- Back cover sliver -->
      <rect x="20" y="1" width="2" height="50" rx="0.5" fill="#B8883A"/>
      <!-- Spine detail lines on front cover -->
      <line x1="4" y1="8" x2="12" y2="8" stroke="#100E0C" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
      <line x1="4" y1="11" x2="10" y2="11" stroke="#100E0C" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
      <line x1="4" y1="42" x2="12" y2="42" stroke="#100E0C" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    </g>
  </g>
  <!-- "Trove" wordmark - serif, aged paper -->
  <text x="52" y="44" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="40" font-weight="600" letter-spacing="-0.5" fill="#EFEAE1">Trove</text>
</svg>
